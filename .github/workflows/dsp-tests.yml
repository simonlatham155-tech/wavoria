name: DSP tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-free DSP tests
        run: cmake -S . -B build -DWAVORIA_BUILD_PLUGIN=OFF -DWAVORIA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
